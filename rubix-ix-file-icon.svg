<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Rubix .ix file icon</title>
  <desc id="desc">A clean white document icon with a black and red geometric R mark and a .ix extension label.</desc>
  <defs>
    <linearGradient id="redAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3038"/>
      <stop offset="1" stop-color="#c90016"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111111" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- File tile -->
  <g filter="url(#shadow)">
    <path d="M112 38 H318 L414 134 V442 Q414 462 394 462 H112 Q92 462 92 442 V58 Q92 38 112 38 Z" fill="#ffffff" stroke="#171717" stroke-width="12" stroke-linejoin="round"/>
    <path d="M318 38 V114 Q318 134 338 134 H414" fill="#f2f2f2" stroke="#171717" stroke-width="12" stroke-linejoin="round"/>
  </g>
  <!-- Geometric R mark inspired by the Rubix wordmark -->
  <g transform="translate(128 137)">
    <path d="M20 0 H118 C161 0 188 24 188 61 C188 87 174 105 151 115 L190 166 H133 L94 116 H64 V166 H20 Z M64 42 V79 H112 C132 79 143 72 143 60 C143 48 132 42 112 42 Z" fill="#111111" fill-rule="evenodd"/>
    <path d="M20 0 L64 24 V79 L20 105 Z" fill="url(#redAccent)"/>
    <path d="M94 116 L133 116 L190 166 H142 Z" fill="#111111"/>
  </g>
  <!-- Extension label -->
  <rect x="132" y="337" width="248" height="76" rx="16" fill="#111111"/>
  <text x="256" y="389" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="48" font-weight="750" letter-spacing="1" fill="#ffffff">.ix</text>
  <rect x="348" y="352" width="14" height="46" rx="7" fill="url(#redAccent)"/>
</svg>
